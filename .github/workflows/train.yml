name: Release Train

# Fully automated Friday MINOR release to BOTH surfaces: npm (@agentage/find-mcp)
# and the official MCP registry (io.agentage/find-mcp). No human step on the happy
# path. Weekly cadence, always a minor bump (product decision 2026-07-30).
#
# Versions are ALIGNED: server.json version == server.json packages[0].version ==
# package.json version. The first train run unifies the historical split lines
# (npm 0.x vs registry 1.0.x) by minor-bumping the semver max of the two - the
# registry marks "latest" by semver max, so the aligned line must continue from
# the higher one.
#
# GITHUB_TOKEN caveats handled here: CI runs on a bot-opened PR land in
# `action_required` (auto-merge never fires), so this workflow approves them; and
# its merges don't fire release.yml's push trigger, so the publish dispatch runs
# explicitly - after the merge has actually landed, never before.
#
# Schedule: single UTC cron, no Prague/DST double-cron and no hour gate - a late
# cron just makes the train depart late instead of being gated away. Dependabot
# opens its weekly PRs at 16:00 UTC and org triage merges them from 17:00 UTC.
on:
  schedule:
    # Friday 19:00 UTC (L0 slot of the estate train; the whole train runs on
    # UTC - GitHub crons fire late by up to 1-2h, so a late run just departs
    # late instead of being hour-gated away).
    - cron: '0 19 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  dependabot-quiescence:
    name: 🤖 Wait for dependabot triage to finish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait until this repo has no fresh open dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dependabot merging is owned by the org triage automation
          # (.github-private): it starts at the dependabot window (16:00 UTC)
          # and merges/fixes PRs with judgment. This job only delays the train
          # while that agent may still be working. PRs still open after the
          # wait were deliberately left by triage - the train departs without them.
          for i in $(seq 1 45); do
            OPEN=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq 'length')
            [ "$OPEN" = "0" ] && { echo "No open dependabot PRs - proceeding."; exit 0; }
            echo "poll $i: $OPEN open dependabot PR(s), waiting for triage..."
            sleep 60
          done
          echo "Dependabot PR(s) still open after wait - releasing without them." | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: 🚝 Cut minor release
    needs: [dependabot-quiescence]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip if an open release PR exists
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | length')
          if [ "$EXISTING" != "0" ]; then
            echo "Open release PR already exists - a previous train is stuck. Skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect releasable commits since the last tag
        id: detect
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          RANGE=""; [ -n "$LAST_TAG" ] && RANGE="${LAST_TAG}..HEAD"
          echo "Last tag: ${LAST_TAG:-none}"
          SUBJECTS=$(git log $RANGE --no-merges --pretty=%s)
          # Releasable = anything except docs/ci/plain-chore; chore(deps) counts
          # (dependabot bundles ship weekly), chore(release) does not.
          RELEASABLE=$(printf '%s\n' "$SUBJECTS" \
            | grep -vE '^(docs|ci)(\([^)]*\))?!?:' \
            | grep -vE '^chore(\([^)]*\))?!?:' || true)
          DEPS=$(printf '%s\n' "$SUBJECTS" | grep -E '^chore\(deps' || true)
          COUNT=$(printf '%s\n%s\n' "$RELEASABLE" "$DEPS" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No releasable commits since ${LAST_TAG:-repo start} - no release this week." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $COUNT releasable commit(s)."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump aligned minor version (package.json + server.json)
        id: bump
        if: steps.guard.outputs.skip != 'true' && steps.detect.outputs.release == 'true'
        run: |
          set -euo pipefail
          NEW=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const parse = (v) => v.split(".").map(Number);
            const [a, b] = [parse(pkg.version), parse(srv.version)];
            const base = a[0] !== b[0] ? (a[0] > b[0] ? a : b) : a[1] !== b[1] ? (a[1] > b[1] ? a : b) : a[2] >= b[2] ? a : b;
            const next = `${base[0]}.${base[1] + 1}.0`;
            pkg.version = next;
            srv.version = next;
            for (const p of srv.packages) p.version = next;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            fs.writeFileSync("server.json", JSON.stringify(srv, null, 2) + "\n");
            console.log(next);
          ')
          npm install --package-lock-only
          echo "New aligned version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Verify
        if: steps.bump.outputs.version
        run: npm run verify

      - name: Create + auto-merge release PR
        id: pr
        if: steps.bump.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json server.json
          git commit -m "chore(release): ${VERSION}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base master --head "$BRANCH" \
            --title "chore(release): ${VERSION}" \
            --body "Weekly minor release train. Aligned version ${VERSION} across package.json and server.json (npm + MCP registry). Publish happens via publish.yml after merge.")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          sleep 5
          if ! OUT=$(gh pr merge "$PR_URL" --auto --squash 2>&1); then
            echo "$OUT"
            echo "$OUT" | grep -q "clean status" && gh pr merge "$PR_URL" --squash || exit 1
          fi

      - name: Approve the release PR's pending workflow runs
        if: steps.pr.outputs.pr_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          # Runs on a bot-opened PR wait in `action_required`; unapproved, they
          # never complete and auto-merge never fires.
          APPROVED=0
          for i in $(seq 1 12); do
            IDS=$(gh api "/repos/$REPO/actions/runs?head_branch=$BRANCH&per_page=50" \
              --jq '.workflow_runs[] | select(.status == "action_required") | .id' || true)
            for ID in $IDS; do
              echo "Approving pending run $ID"
              if gh api -X POST "/repos/$REPO/actions/runs/$ID/approve" >/dev/null; then APPROVED=1; fi
            done
            [ "$APPROVED" = "1" ] && break
            echo "poll $i: no pending runs yet on $BRANCH"
            sleep 10
          done
          [ "$APPROVED" = "1" ] || echo "No action_required runs seen - nothing to approve."

      - name: Wait for the release PR to merge
        if: steps.pr.outputs.pr_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            [ "$STATE" = "MERGED" ] && { echo "Release PR merged."; exit 0; }
            # A run can appear late; keep clearing approvals while we wait.
            for ID in $(gh api "/repos/$REPO/actions/runs?head_branch=$BRANCH&per_page=50" \
              --jq '.workflow_runs[] | select(.status == "action_required") | .id' || true); do
              gh api -X POST "/repos/$REPO/actions/runs/$ID/approve" >/dev/null || true
            done
            echo "poll $i: PR state $STATE, waiting for auto-merge..."
            sleep 20
          done
          echo "Release PR $PR_URL NOT merged after 4 minutes - train blocked, publish NOT dispatched." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Dispatch publish workflow
        if: steps.pr.outputs.pr_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Runs only post-merge: a pre-merge dispatch builds master without the
          # version bump and silently no-ops, and the merge itself fires nothing.
          gh workflow run release.yml --ref master --repo "${{ github.repository }}"
          echo "Released ${{ steps.bump.outputs.version }} - release.yml dispatched." >> "$GITHUB_STEP_SUMMARY"
