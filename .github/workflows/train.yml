name: Release Train

# Fully automated Friday MINOR release to BOTH surfaces: npm (@agentage/find-mcp)
# and the official MCP registry (io.agentage/find-mcp). No human step on the happy
# path. Weekly cadence, always a minor bump (product decision 2026-07-30).
#
# Versions are ALIGNED: server.json version == server.json packages[0].version ==
# package.json version. The registry marks "latest" by semver max, so the aligned
# line always continues from the higher of the two.
#
# v2 delivery (2026-08-22): the release commit goes DIRECT TO MASTER. The old
# branch -> PR -> auto-merge -> self-approve -> poll-merged chain broke three
# different ways in three weeks (repo auto-merge setting, the action_required
# approval gate, a guard field bug); none of that machinery exists any more.
# `npm run verify` runs before the push, a rejected push is a red run (never a
# force), and the train only goes green once the dispatched publish run has
# succeeded AND npm actually serves the new version. Red run = the only alarm;
# there are no silent-skip states.
#
# Schedule: single UTC cron, no Prague/DST double-cron and no hour gate - a late
# cron just makes the train depart late instead of being gated away. Dependabot
# opens its weekly PRs at 16:00 UTC and org triage merges them from 17:00 UTC.
on:
  schedule:
    # Friday 19:00 UTC (L0 slot of the estate train; the whole train runs on
    # UTC - GitHub crons fire late by up to 1-2h, so a late run just departs
    # late instead of being hour-gated away).
    - cron: '17 4 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  dependabot-quiescence:
    name: 🤖 Wait for dependabot triage to finish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait until this repo has no fresh open dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dependabot merging is owned by the org triage automation
          # (.github-private): it starts at the dependabot window (16:00 UTC)
          # and merges/fixes PRs with judgment. This job only delays the train
          # while that agent may still be working. PRs still open after the
          # wait were deliberately left by triage - the train departs without them.
          for i in $(seq 1 45); do
            OPEN=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq 'length')
            [ "$OPEN" = "0" ] && { echo "No open dependabot PRs - proceeding."; exit 0; }
            echo "poll $i: $OPEN open dependabot PR(s), waiting for triage..."
            sleep 60
          done
          echo "Dependabot PR(s) still open after wait - releasing without them." | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: 🚝 Cut minor release
    needs: [dependabot-quiescence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect releasable commits since the last tag
        id: detect
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          RANGE=""; [ -n "$LAST_TAG" ] && RANGE="${LAST_TAG}..HEAD"
          echo "Last tag: ${LAST_TAG:-none}"
          SUBJECTS=$(git log $RANGE --no-merges --pretty=%s)
          # Releasable = anything except docs/ci/plain-chore; chore(deps) counts
          # (dependabot bundles ship weekly), chore(release) does not.
          RELEASABLE=$(printf '%s\n' "$SUBJECTS" \
            | grep -vE '^(docs|ci)(\([^)]*\))?!?:' \
            | grep -vE '^chore(\([^)]*\))?!?:' || true)
          DEPS=$(printf '%s\n' "$SUBJECTS" | grep -E '^chore\(deps' || true)
          COUNT=$(printf '%s\n%s\n' "$RELEASABLE" "$DEPS" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No releasable commits since ${LAST_TAG:-repo start} - no release this week." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $COUNT releasable commit(s)."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump aligned minor version (package.json + server.json)
        id: bump
        if: steps.detect.outputs.release == 'true'
        run: |
          set -euo pipefail
          NEW=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const parse = (v) => v.split(".").map(Number);
            const [a, b] = [parse(pkg.version), parse(srv.version)];
            const base = a[0] !== b[0] ? (a[0] > b[0] ? a : b) : a[1] !== b[1] ? (a[1] > b[1] ? a : b) : a[2] >= b[2] ? a : b;
            const next = `${base[0]}.${base[1] + 1}.0`;
            pkg.version = next;
            srv.version = next;
            for (const p of srv.packages) p.version = next;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            fs.writeFileSync("server.json", JSON.stringify(srv, null, 2) + "\n");
            console.log(next);
          ')
          npm install --package-lock-only
          echo "New aligned version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Verify
        if: steps.bump.outputs.version
        run: npm run verify

      - name: Commit release direct to master
        id: push
        if: steps.bump.outputs.version
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.json
          git commit -m "chore(release): ${VERSION}"
          # master may have moved while the train ran; rebase on it. A rejected
          # push is a red run - never force.
          git pull --rebase origin master
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch publish workflow
        id: dispatch
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN push never fires release.yml's push trigger, so dispatch
          # it explicitly. Its dispatch path re-verifies, skips if the version is
          # already on npm, then publishes to npm, tags, cuts the GitHub release
          # and pushes the MCP registry entry.
          BEFORE=$(gh run list -R "$REPO" --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run release.yml --ref master --repo "$REPO"
          RUN_ID=""
          for i in $(seq 1 24); do
            # a transient API blip must not red the train - just poll again
            ID=$(gh run list -R "$REPO" --workflow release.yml --json databaseId --jq '.[0].databaseId // 0' || echo "$BEFORE")
            [ "$ID" != "$BEFORE" ] && { RUN_ID="$ID"; break; }
            echo "poll $i: dispatched run not visible yet"
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::release.yml dispatch never produced a run"
            echo "Publish dispatch produced no run - ${{ steps.bump.outputs.version }} NOT published." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched publish run https://github.com/$REPO/actions/runs/$RUN_ID"

      - name: Wait for the publish run to finish
        if: steps.dispatch.outputs.run_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          # Fail-closed: a red publish is a red train, not a green one with a
          # stranded version bump on master.
          CONCL=""
          for i in $(seq 1 120); do
            OUT=$(gh run view "$RUN_ID" -R "$REPO" --json status,conclusion --jq '.status + "|" + (.conclusion // "")' || echo "unknown|")
            STATUS="${OUT%%|*}"; CONCL="${OUT##*|}"
            [ "$STATUS" = "completed" ] && break
            echo "poll $i: publish run $STATUS"
            sleep 15
          done
          if [ "$CONCL" != "success" ]; then
            echo "::error::publish run concluded '${CONCL:-timeout}'"
            echo "Publish run https://github.com/$REPO/actions/runs/$RUN_ID concluded '${CONCL:-timeout}' - release incomplete." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Assert the release actually shipped
        if: steps.dispatch.outputs.run_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          NAME=$(node -p "require('./package.json').name")
          SERVED=""
          for i in $(seq 1 20); do
            SERVED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
            [ "$SERVED" = "$VERSION" ] && break
            echo "poll $i: npm not serving ${NAME}@${VERSION} yet"
            sleep 15
          done
          if [ "$SERVED" != "$VERSION" ]; then
            echo "::error::npm does not serve ${NAME}@${VERSION}"
            echo "npm never served ${NAME}@${VERSION} - release incomplete." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # release.yml cuts the GitHub release for this repo; assert it landed.
          gh release view "v${VERSION}" >/dev/null 2>&1 || {
            echo "::error::no GitHub release v${VERSION}"
            echo "GitHub release v${VERSION} missing - release incomplete." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "Released ${NAME}@${VERSION} - npm + MCP registry + GitHub release." >> "$GITHUB_STEP_SUMMARY"
