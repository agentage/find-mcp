name: Publish Package

# Publishes on a chore(release) merge via OIDC trusted publishing (npmjs.com publisher = this file).

on:
  push:
    branches: [master]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qE "(^Release v|^chore: prepare release|^chore\(release\))"; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit - skipping publish."
          fi

  publish:
    name: Publish to npm
    needs: [release-gate]
    if: needs.release-gate.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm install -g npm@latest && npm --version # OIDC needs npm >= 11.5.1
      - run: npm ci
      - name: Skip if version already on npm
        id: ver
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - if: steps.ver.outputs.publish == 'true'
        run: npm run verify
      - name: Live smoke against the real directory
        if: steps.ver.outputs.publish == 'true'
        env:
          LIVE_SMOKE: '1'
        run: npm test -- test/live-smoke.test.ts
      - name: Publish (tolerates only an already-published conflict)
        if: steps.ver.outputs.publish == 'true'
        run: |
          npm publish --access public --provenance && exit 0
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          npm view "${name}@${version}" version >/dev/null 2>&1 && { echo "${name}@${version} already on npm"; exit 0; }
          echo "::error::npm publish failed for ${name}@${version}"; exit 1
      - if: steps.ver.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      # Everything below is idempotent and runs on every release-gated invocation,
      # so re-running this workflow repairs a partial failure (npm published but
      # GH release / registry publish stranded).
      - name: Create GitHub release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG exists"; exit 0; }
          gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Wait for npm to serve the new version
        run: |
          # The registry validates the npm tarball's mcpName field, and npm reads
          # lag a successful publish by a few minutes - poll before publishing.
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do
            npm view "${name}@${version}" version >/dev/null 2>&1 && exit 0
            echo "npm not serving ${version} yet ($i), waiting..."; sleep 30
          done
          echo "::error::npm never served ${name}@${version}"; exit 1

      - name: Publish to the official MCP registry (if not current)
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          want=$(node -p "require('./server.json').version")
          have=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers/io.agentage%2Ffind-mcp/versions" \
            | node -p "const d=JSON.parse(require('fs').readFileSync(0));(d.servers||[]).find(s=>(s._meta?.['io.modelcontextprotocol.registry/official']?.isLatest))?.server?.version ?? ''" 2>/dev/null || true)
          [ "$have" = "$want" ] && { echo "registry already serves $want"; exit 0; }
          VER=$(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | node -p "JSON.parse(require('fs').readFileSync(0)).tag_name")
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/${VER}/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          ./mcp-publisher login http --domain agentage.io --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
          rm -f mcp-publisher

      - name: Verify registry serves the aligned version
        run: |
          version=$(node -p "require('./server.json').version")
          for i in $(seq 1 10); do
            LATEST=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers/io.agentage%2Ffind-mcp/versions" \
              | node -p "const d=JSON.parse(require('fs').readFileSync(0));(d.servers||[]).find(s=>(s._meta?.['io.modelcontextprotocol.registry/official']?.isLatest))?.server?.version ?? ''" 2>/dev/null || true)
            [ "$LATEST" = "$version" ] && { echo "registry latest = $LATEST ✓"; exit 0; }
            echo "registry latest is '$LATEST', want $version ($i)"; sleep 15
          done
          echo "::error::registry never showed ${version} as latest"; exit 1
